# Local stack: Postgres (the operational source), the ingestion service, and a pipeline run.
#   docker compose up -d postgres ingest
#   docker compose run --rm pipeline run            # full backfill
#   docker compose run --rm pipeline run --incremental
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nyrt
      POSTGRES_PASSWORD: nyrt
      POSTGRES_DB: nyrt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyrt"]
      interval: 5s
      retries: 10

  ingest:
    build: .
    command: ["serve", "--port", "8080"]
    environment:
      NYRT_PG_DSN: postgresql://nyrt:nyrt@postgres:5432/nyrt
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  pipeline:
    build: .
    environment:
      NYRT_PG_DSN: postgresql://nyrt:nyrt@postgres:5432/nyrt
      NYRT_INGEST_URL: http://ingest:8080
      NYRT_SOCRATA_APP_TOKEN: ${NYRT_SOCRATA_APP_TOKEN:-}
    volumes:
      - ./data:/data
      - ./dashboard/data:/app/dashboard/data
    depends_on:
      postgres: { condition: service_healthy }
      ingest: { condition: service_started }

volumes:
  pgdata:
