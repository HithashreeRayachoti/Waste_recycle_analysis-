[project]
name = "nyrt"
version = "0.1.0"
description = "NY Recycling Tracker: DSNY monthly tonnage -> Postgres -> medallion warehouse -> dashboard"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.1",
  "pyarrow>=14",
  "duckdb>=1.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
spark = ["pyspark>=3.5"]
bigquery = ["google-cloud-bigquery>=3.17"]

[project.scripts]
nyrt = "nyrt.cli:main"
nyrt-bq = "nyrt.transform.bigquery:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a running Postgres (set NYRT_PG_DSN)", "spark: needs pyspark and Java"]
